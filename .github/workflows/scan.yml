name: Web Vulnerability Scanner - PR Check

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install

      - name: Run Web Vulnerability Scanner (safe mode)
        id: scan
        run: |
          python scripts/auth_scan.py \
            --url https://example.com \
            --artifacts ./scan-artifacts

      - name: Convert to SARIF (optional)
        if: always()
        run: |
          python -c "
          import json
          from src.scanner.sarif import generate_sarif
          
          with open('./scan-artifacts/scan_result.json') as f:
            result = json.load(f)
          
          sarif = generate_sarif(result.get('findings', []), 'https://example.com')
          with open('scan-results.sarif', 'w') as f:
            json.dump(sarif, f, indent=2)
          "

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: scan-results.sarif
          category: web-vuln-scanner

      - name: Comment on PR with results
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('./scan-artifacts/scan_result.json'));
            const findings = result.findings || [];
            
            const comment = `## 🔒 Web Vulnerability Scanner Results
            
            **Findings:** ${findings.length}
            
            ${findings.length === 0 ? '✅ No vulnerabilities detected!' : '⚠️ Issues found - see SARIF upload for details'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
